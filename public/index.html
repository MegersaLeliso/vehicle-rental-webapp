<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Wheels | Vehicle Rental</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #64716b;
      --paper: #f3f5f1;
      --surface: #fff;
      --line: #e0e6df;
      --green: #18764f;
      --green-dark: #105b3c;
      --amber: #a45b12;
      --red: #ad413b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px max(24px, calc((100% - 1180px) / 2));
      background: #14251e;
      color: #fff;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 12px;
      background: #b7e5c4;
      color: #14251e;
      font-weight: 900;
    }
    h1, h2, h3, p { margin-top: 0; }
    header h1 { margin: 0; font-size: 19px; letter-spacing: -.03em; }
    header p { margin: 4px 0 0; color: #b9c9c0; font-size: 13px; }
    .live { color: #b7e5c4; font-size: 13px; }
    .live::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #63d392; }
    main { width: min(1180px, calc(100% - 40px)); margin: 34px auto 60px; }
    .overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
    .stat, .panel, .vehicle-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 5px 18px rgb(23 33 29 / 4%);
    }
    .stat { padding: 19px 21px; }
    .stat-label { margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .stat-value { margin: 0; font-size: 27px; font-weight: 750; letter-spacing: -.04em; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(290px, .85fr); gap: 20px; align-items: start; }
    .panel { padding: 22px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
    .section-heading h2, .panel h2 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
    .section-heading p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .fleet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 13px; }
    .vehicle-card { padding: 17px; box-shadow: none; }
    .vehicle-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .vehicle-type { margin-bottom: 5px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .vehicle-name { margin: 0; font-size: 17px; }
    .plate { margin: 7px 0 16px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .badge { padding: 6px 9px; border-radius: 999px; background: #e6f4eb; color: var(--green-dark); font-size: 11px; font-weight: 750; white-space: nowrap; }
    .badge.rented { background: #f9e9e6; color: var(--red); }
    .vehicle-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 13px; }
    .rate { font-size: 16px; font-weight: 750; }
    .rate small { color: var(--muted); font-size: 11px; font-weight: 500; }
    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 13px;
      background: var(--green);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--green-dark); }
    button.secondary { border: 1px solid var(--line); background: #fff; color: var(--ink); }
    button.secondary:hover { background: #f3f5f1; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    form { display: grid; gap: 13px; margin-top: 18px; }
    label { display: grid; gap: 7px; color: #45524b; font-size: 12px; font-weight: 700; }
    select, input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #d5ddd5;
      border-radius: 9px;
      padding: 9px 11px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
    }
    .form-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 2px; }
    .feedback { min-height: 20px; margin: 14px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .feedback.error { color: var(--red); }
    .feedback.success { color: var(--green-dark); }
    .activity { margin-top: 20px; padding-top: 17px; border-top: 1px solid var(--line); }
    .activity h3 { margin-bottom: 11px; font-size: 13px; }
    .activity-list { display: grid; gap: 9px; max-height: 170px; overflow: auto; padding: 0; list-style: none; }
    .activity-list li { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .empty { grid-column: 1 / -1; padding: 24px; color: var(--muted); text-align: center; }
    .refresh { padding: 8px 11px; }
    @media (max-width: 760px) {
      header { padding: 18px 20px; }
      main { width: min(100% - 28px, 600px); margin-top: 22px; }
      .overview { gap: 9px; }
      .stat { padding: 14px 12px; }
      .stat-label { font-size: 10px; }
      .stat-value { font-size: 21px; }
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 420px) {
      .overview { grid-template-columns: 1fr; }
      .live { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">MW</div>
      <div>
        <h1>Metro Wheels</h1>
        <p>Vehicle rental operations</p>
      </div>
    </div>
    <div class="live">Connected to rental service</div>
  </header>

  <main>
    <section class="overview" aria-label="Agency overview">
      <article class="stat"><div class="stat-label">Fleet vehicles</div><p class="stat-value" id="fleet-count">—</p></article>
      <article class="stat"><div class="stat-label">Available now</div><p class="stat-value" id="available-count">—</p></article>
      <article class="stat"><div class="stat-label">Rental revenue</div><p class="stat-value" id="total-revenue">—</p></article>
    </section>

    <div class="layout">
      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Fleet status</h2>
            <p>Live availability and daily rates</p>
          </div>
          <button class="secondary refresh" id="refresh-button" type="button">Refresh</button>
        </div>
        <div class="fleet-grid" id="fleet-grid" aria-live="polite">
          <div class="empty">Loading fleet…</div>
        </div>
      </section>

      <aside class="panel">
        <h2>Dispatch console</h2>
        <form id="rental-form">
          <label for="customer-select">Registered customer
            <select id="customer-select" required></select>
          </label>
          <label for="vehicle-select">Vehicle
            <select id="vehicle-select" required></select>
          </label>
          <label for="days-input">Rental days
            <input id="days-input" type="number" min="1" value="1" required>
          </label>
          <div class="form-actions">
            <button id="rent-button" type="submit">Rent vehicle</button>
            <button class="secondary" id="return-button" type="button">Return selected</button>
          </div>
        </form>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
        <div class="activity">
          <h3>Activity log</h3>
          <ul class="activity-list" id="activity-list"><li>Waiting for activity…</li></ul>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const fleetGrid = document.getElementById("fleet-grid");
    const customerSelect = document.getElementById("customer-select");
    const vehicleSelect = document.getElementById("vehicle-select");
    const feedback = document.getElementById("feedback");
    const activityList = document.getElementById("activity-list");
    let vehicles = [];

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || `Request failed (${response.status})`);
      }
      return data;
    }

    function addActivity(message) {
      const item = document.createElement("li");
      item.textContent = `${new Date().toLocaleTimeString()} — ${message}`;
      if (activityList.firstElementChild?.textContent === "Waiting for activity…") {
        activityList.replaceChildren();
      }
      activityList.prepend(item);
      while (activityList.children.length > 12) {
        activityList.lastElementChild.remove();
      }
    }

    function setFeedback(message, kind) {
      feedback.textContent = message;
      feedback.className = `feedback ${kind || ""}`;
    }

    function updateRentButton() {
      const selectedVehicle = vehicles.find((vehicle) => vehicle.plate === vehicleSelect.value);
      document.getElementById("rent-button").disabled = !selectedVehicle || !selectedVehicle.available;
    }

    function renderVehicles() {
      fleetGrid.replaceChildren();
      if (vehicles.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No vehicles are registered.";
        fleetGrid.append(empty);
      }

      vehicles.forEach((vehicle) => {
        const card = document.createElement("article");
        card.className = "vehicle-card";
        const top = document.createElement("div");
        top.className = "vehicle-top";
        const details = document.createElement("div");
        const type = document.createElement("div");
        type.className = "vehicle-type";
        type.textContent = vehicle.type;
        const name = document.createElement("h3");
        name.className = "vehicle-name";
        name.textContent = `${vehicle.year} ${vehicle.make} ${vehicle.model}`;
        details.append(type, name);

        const badge = document.createElement("span");
        badge.className = `badge${vehicle.available ? "" : " rented"}`;
        badge.textContent = vehicle.available ? "Available" : "Rented out";
        top.append(details, badge);

        const plate = document.createElement("p");
        plate.className = "plate";
        plate.textContent = vehicle.plate;

        const bottom = document.createElement("div");
        bottom.className = "vehicle-bottom";
        const rate = document.createElement("div");
        rate.className = "rate";
        rate.textContent = `$${Number(vehicle.dailyRate).toFixed(2)}`;
        const perDay = document.createElement("small");
        perDay.textContent = " / day";
        rate.append(perDay);
        bottom.append(rate);
        if (!vehicle.available) {
          const returnButton = document.createElement("button");
          returnButton.className = "secondary";
          returnButton.type = "button";
          returnButton.textContent = "Return";
          returnButton.addEventListener("click", () => returnVehicle(vehicle.plate));
          bottom.append(returnButton);
        }
        card.append(top, plate, bottom);
        fleetGrid.append(card);
      });

      const previousPlate = vehicleSelect.value;
      vehicleSelect.replaceChildren();
      if (vehicles.length === 0) {
        const option = new Option("No vehicles available", "");
        vehicleSelect.add(option);
        vehicleSelect.disabled = true;
      } else {
        vehicles.forEach((vehicle) => {
          const status = vehicle.available ? "" : " — Rented out";
          const option = new Option(`${vehicle.type} — ${vehicle.plate} ($${Number(vehicle.dailyRate).toFixed(2)}/day)${status}`, vehicle.plate);
          vehicleSelect.add(option);
        });
        vehicleSelect.disabled = false;
        if (vehicles.some((vehicle) => vehicle.plate === previousPlate)) {
          vehicleSelect.value = previousPlate;
        }
      }
      updateRentButton();
    }

    async function refreshDashboard() {
      const [vehicleData, customerData, report] = await Promise.all([
        requestJson("/api/vehicles"),
        requestJson("/api/customers"),
        requestJson("/api/report")
      ]);
      vehicles = vehicleData;
      renderVehicles();

      const selectedCustomer = customerSelect.value;
      customerSelect.replaceChildren();
      customerData.forEach((customer) => {
        customerSelect.add(new Option(customer.name, customer.name));
      });
      if (customerData.some((customer) => customer.name === selectedCustomer)) {
        customerSelect.value = selectedCustomer;
      }

      document.getElementById("fleet-count").textContent = report.totalFleetCount;
      document.getElementById("available-count").textContent = report.availableCount;
      document.getElementById("total-revenue").textContent = `$${Number(report.totalRevenue).toFixed(2)}`;
    }

    async function returnVehicle(plate) {
      try {
        const result = await requestJson("/api/return", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ plate })
        });
        setFeedback(result.message, "success");
        addActivity(result.message);
        await refreshDashboard();
      } catch (error) {
        setFeedback(error.message, "error");
        addActivity(`Return failed: ${error.message}`);
      }
    }

    document.getElementById("rental-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const result = await requestJson("/api/rent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            customerName: customerSelect.value,
            plate: vehicleSelect.value,
            days: Number(document.getElementById("days-input").value)
          })
        });
        setFeedback(`${result.message} Total: $${Number(result.totalCost).toFixed(2)}.`, "success");
        addActivity(`${result.message} Total $${Number(result.totalCost).toFixed(2)}.`);
        await refreshDashboard();
      } catch (error) {
        setFeedback(error.message, "error");
        addActivity(`Rental failed: ${error.message}`);
      }
    });

    document.getElementById("return-button").addEventListener("click", () => {
      returnVehicle(vehicleSelect.value);
    });
    vehicleSelect.addEventListener("change", updateRentButton);
    document.getElementById("refresh-button").addEventListener("click", async () => {
      try {
        await refreshDashboard();
        setFeedback("Fleet and report refreshed.", "success");
      } catch (error) {
        setFeedback(error.message, "error");
      }
    });

    refreshDashboard().catch((error) => {
      setFeedback(`Could not load dashboard: ${error.message}`, "error");
      fleetGrid.textContent = "The rental service could not be reached.";
    });
  </script>
</body>
</html>
